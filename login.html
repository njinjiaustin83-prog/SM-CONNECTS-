<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to your SM CONNECTS account.">
  <title>Log In — SM CONNECTS</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .login-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
    }

    .login-card {
      width: min(100%, 480px);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 36px;
      box-shadow: 0 20px 60px rgba(0,0,0,.08);
    }

    .login-card h1 {
      font-size: 2.6rem;
      line-height: 1;
      margin: 0 0 12px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 30px;
    }

    .field {
      margin-bottom: 20px;
    }

    .field label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .field input {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      font: inherit;
    }

    .password-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .forgot {
      font-size: .85rem;
      color: #e84b7a;
      text-decoration: none;
      font-weight: 700;
    }

    .login-button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 14px;
      background: #17151b;
      color: #fff;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
    }

    .login-button:disabled {
      opacity: .6;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 12px;
      background: #fff0f4;
      color: #9c214d;
    }

    .signup-link {
      text-align: center;
      margin-top: 25px;
      color: var(--muted);
    }

    .signup-link a {
      color: #e84b7a;
      font-weight: 800;
      text-decoration: none;
    }

    .back {
      display: inline-block;
      margin-bottom: 25px;
      color: #17151b;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>

<body>

<header class="nav">
  <a class="brand" href="index.html">
    SM <span>CONNECTS</span>
  </a>
</header>

<main class="login-page">

  <section class="login-card">

    <a class="back" href="index.html">
      ← Back to SM CONNECTS
    </a>

    <p class="eyebrow">Welcome back</p>

    <h1>Log in.</h1>

    <p class="subtitle">
      Continue discovering meaningful connections.
    </p>

    <form id="loginForm" novalidate>

      <div class="field">
        <label for="email">
          Email address
        </label>

        <input
          id="email"
          name="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="field">

        <div class="password-row">
          <label for="password">
            Password
          </label>

          <a class="forgot" href="#">
            Forgot password?
          </a>
        </div>

        <input
          id="password"
          name="password"
          type="password"
          placeholder="Your password"
          autocomplete="current-password"
          required
        >

      </div>

      <button
        class="login-button"
        id="loginButton"
        type="submit"
      >
        Log in
      </button>

      <div
        class="message"
        id="message"
        role="alert"
      ></div>

    </form>

    <p class="signup-link">
      Don't have an account?
      <a href="signup.html">Create one</a>
    </p>

  </section>

</main>

<script>

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginButton");

form.addEventListener("submit", function(event) {

  event.preventDefault();

  message.style.display = "none";

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if (!email || !email.includes("@")) {
    showError("Please enter a valid email address.");
    return;
  }

  if (!password) {
    showError("Please enter your password.");
    return;
  }

  button.disabled = true;
  button.textContent = "Logging in...";

  /*
   * PRODUCTION AUTHENTICATION
   *
   * This form will connect to the secure SM CONNECTS
   * authentication backend.
   *
   * Passwords must never be stored in this HTML file
   * or directly in browser storage.
   */

  setTimeout(function() {

    message.style.display = "block";

    message.textContent =
      "Login is ready for the secure authentication backend.";

    button.disabled = false;
    button.textContent = "Log in";

  }, 700);

});


function showError(text) {

  message.style.display = "block";
  message.textContent = text;

}

</script>

</body>
</html>feat: add SM CONNECTS login page
