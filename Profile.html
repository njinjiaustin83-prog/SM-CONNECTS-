<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Profile | SM CONNECTS</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="auth-container">

    <section class="auth-card">

      <h1>Complete Your Profile</h1>
      <p>Tell people a little about yourself.</p>

      <form id="profileForm">

        <label for="dateOfBirth">Date of birth</label>
        <input
          type="date"
          id="dateOfBirth"
          required
        >

        <label for="gender">I am</label>
        <select id="gender" required>
          <option value="">Select</option>
          <option value="man">A man</option>
          <option value="woman">A woman</option>
          <option value="non-binary">Non-binary</option>
          <option value="prefer-not-to-say">Prefer not to say</option>
        </select>

        <label for="interestedIn">Interested in</label>
        <select id="interestedIn" required>
          <option value="">Select</option>
          <option value="men">Men</option>
          <option value="women">Women</option>
          <option value="everyone">Everyone</option>
        </select>

        <label for="country">Country</label>
        <input
          type="text"
          id="country"
          placeholder="Nigeria"
          required
        >

        <label for="state">State / Region</label>
        <input
          type="text"
          id="state"
          placeholder="State or region"
          required
        >

        <label for="city">City</label>
        <input
          type="text"
          id="city"
          placeholder="City"
          required
        >

        <label for="bio">About me</label>
        <textarea
          id="bio"
          rows="5"
          maxlength="500"
          placeholder="Tell people something about yourself..."
        ></textarea>

        <label for="photo">Profile photo URL</label>
        <input
          type="url"
          id="photo"
          placeholder="https://example.com/photo.jpg"
        >

        <button type="submit" id="saveButton">
          Save Profile
        </button>

        <p id="message"></p>

      </form>

    </section>

  </main>

  <script>
    const form = document.getElementById("profileForm");
    const message = document.getElementById("message");
    const saveButton = document.getElementById("saveButton");

    const storedUser =
      localStorage.getItem("sm_connects_user");

    if (!storedUser) {
      message.textContent =
        "Please create an account first.";

      saveButton.disabled = true;
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (!storedUser) {
        return;
      }

      let user;

      try {
        user = JSON.parse(storedUser);
      } catch (error) {
        message.textContent =
          "Your account session is invalid.";
        return;
      }

      saveButton.disabled = true;
      saveButton.textContent = "Saving...";

      const profile = {
        dateOfBirth:
          document.getElementById("dateOfBirth").value,

        gender:
          document.getElementById("gender").value,

        interestedIn:
          document.getElementById("interestedIn").value,

        country:
          document.getElementById("country").value.trim(),

        state:
          document.getElementById("state").value.trim(),

        city:
          document.getElementById("city").value.trim(),

        bio:
          document.getElementById("bio").value.trim(),

        photo:
          document.getElementById("photo").value.trim()
      };

      try {
        const response = await fetch(
          `/api/profile/${encodeURIComponent(user.id)}`,
          {
            method: "PUT",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(profile)
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.message || "Unable to save profile."
          );
        }

        message.textContent =
          "Profile saved successfully!";

        setTimeout(() => {
          window.location.href = "discover.html";
        }, 800);

      } catch (error) {
        message.textContent = error.message;

        saveButton.disabled = false;
        saveButton.textContent = "Save Profile";
      }
    });
  </script>

</body>
</html>Connect profile creation to backend
