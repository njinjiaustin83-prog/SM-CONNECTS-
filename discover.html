<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Discover people on SM CONNECTS.">
  <title>Discover — SM CONNECTS</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .discover-page {
      max-width: 1200px;
      margin: auto;
      padding: 45px 20px 80px;
    }

    .discover-header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 30px;
    }

    .discover-header h1 {
      font-size: clamp(2.4rem, 5vw, 4rem);
      line-height: 1;
      margin: 0;
    }

    .filters {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 12px;
      margin-bottom: 30px;
    }

    .filters select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      font: inherit;
    }

    .filter-button {
      border: 0;
      border-radius: 10px;
      background: #17151b;
      color: white;
      padding: 0 20px;
      font-weight: 800;
      cursor: pointer;
    }

    .profiles {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .profile-card {
      overflow: hidden;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 25px;
      box-shadow: 0 12px 35px rgba(0,0,0,.06);
    }

    .profile-photo {
      height: 330px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #f5d8df, #e8dcfa);
      font-size: 5rem;
    }

    .profile-info {
      padding: 22px;
    }

    .profile-name {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .profile-name h2 {
      margin: 0;
      font-size: 1.45rem;
    }

    .online {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #32b768;
      display: inline-block;
    }

    .location {
      color: var(--muted);
      margin: 5px 0 13px;
    }

    .bio {
      color: var(--muted);
      font-size: .95rem;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 15px 0;
    }

    .tag {
      padding: 6px 10px;
      background: #faf3f5;
      border-radius: 999px;
      font-size: .8rem;
      font-weight: 700;
    }

    .profile-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .profile-actions button {
      height: 45px;
      border: 0;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
    }
